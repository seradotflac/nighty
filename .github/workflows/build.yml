
name: Build Nighty EXE

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        shell: pwsh
        run: |
          python -m py_compile Nighty.py
          python -m compileall -q discord webview

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Check required local modules
        shell: pwsh
        run: |
          python -c "import importlib.util, sys; missing = [name for name in ('nightycore', 'discord_client') if importlib.util.find_spec(name) is None]; print('Missing required modules: ' + ', '.join(missing) if missing else 'Required modules found'); sys.exit(bool(missing))"

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name Nighty `
            --paths . `
            --collect-submodules webview.platforms `
            --add-data "Nighty.htm;." `
            --add-data "nighty_web_files;nighty_web_files" `
            --add-binary "webview/lib;webview/lib" `
            --add-binary "discord/bin;discord/bin" `
            Nighty.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Nighty-Windows
          path: dist/Nighty.exe
          if-no-files-found: error
          retention-days: 30
