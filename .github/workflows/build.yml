
name: Build Nighty EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name Nighty --paths . --add-data "Nighty.htm;." --add-data "nighty_web_files;nighty_web_files" Nighty.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Nighty-Windows
          path: dist/Nighty.exe
